<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>火影忍者 OL 启动器</title>
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-topbar">
        <div class="brand">
          <img src="logo.png" alt="火影忍者 OL" width="24" height="24" />
          <h1 class="brand-title">火影忍者 OL 启动器</h1>
        </div>
        <div class="topbar-actions">
          <button
            class="icon-button"
            id="alwaysOnTopBtn"
            title="保持窗口最前"
            aria-label="窗口置顶"
          >
            📌 窗口置顶
          </button>
        </div>
      </header>

      <main class="app-content">
        <section class="toolbar" aria-label="Profile 工具栏">
          <input
            id="searchInput"
            type="search"
            class="search-input"
            placeholder="按 Profile 名称搜索…"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索 Profile"
          />
          <button class="primary-button" id="createProfileBtn">+ 新建 Profile</button>
        </section>

        <section class="profile-section" aria-label="Profile 列表区域">
          <div class="section-heading">
            <h2>Profile 列表</h2>
            <span class="profile-count-badge" id="profileCount">0 个 Profile</span>
          </div>
          <div class="profile-grid" id="profileGrid" aria-live="polite"></div>
          <div class="empty-state" id="emptyState">
            <h3>还没有 Profile</h3>
            <p>点击右上方“+ 新建 Profile”，即可创建独立的持久化腾讯游戏会话。</p>
          </div>
        </section>
      </main>

      <footer class="statusbar" aria-label="系统运行状态栏">
        <div class="statusbar-info">
          <span class="statusbar-label">运行状态：</span>
          <span id="memorySummary">正在读取内存状态…</span>
        </div>
        <div class="statusbar-actions">
          <button class="ghost-button compact" id="refreshBtn">刷新</button>
          <button class="ghost-button compact" id="diagnosticsBtn">导出脱敏诊断</button>
        </div>
      </footer>
    </div>

    <div
      class="modal-backdrop"
      id="profileModal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="profileModalTitle"
    >
      <form class="modal" id="profileForm">
        <div class="modal-heading">
          <h2 id="profileModalTitle">新建 Profile</h2>
          <button
            class="modal-close-btn"
            id="closeProfileModalBtn"
            type="button"
            aria-label="关闭对话框"
            title="关闭"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 14 14"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M13 1L1 13M1 1L13 13"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
        </div>
        <div class="modal-body">
          <label class="form-field" htmlFor="profileName">
            <span class="field-label">名称</span>
            <input
              id="profileName"
              type="text"
              maxlength="40"
              required
              placeholder="例如：主账号…"
              autocomplete="off"
              spellcheck="false"
            />
          </label>

          <div class="form-field">
            <span class="field-label">标识颜色</span>
            <div class="color-picker-row">
              <button
                type="button"
                class="color-swatch-button"
                id="colorSwatchBtn"
                title="选择颜色"
                aria-label="选择标识颜色"
              >
                <span
                  class="color-swatch-preview"
                  id="colorSwatchPreview"
                  style="background-color: #ff8c00"
                ></span>
              </button>
              <span class="color-hex-text" id="colorHexText">#FF8C00</span>
              <button
                type="button"
                class="secondary-button compact color-change-btn"
                id="changeColorBtn"
              >
                更改
              </button>
              <input
                id="profileColor"
                type="color"
                value="#ff8c00"
                class="visually-hidden-color-input"
                aria-label="选择颜色"
              />
            </div>
          </div>

          <label class="form-field" htmlFor="profileNotes">
            <span class="field-label">备注说明</span>
            <textarea
              id="profileNotes"
              maxlength="200"
              rows="3"
              placeholder="可选，例如：专职押镖或大号…"
              spellcheck="false"
            ></textarea>
          </label>

          <label class="check-row">
            <input id="profileNotifications" type="checkbox" checked />
            <span>启用本地桌面通知</span>
          </label>
        </div>
        <div class="modal-actions">
          <button class="secondary-button" id="cancelProfileBtn" type="button">取消</button>
          <button class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </div>

    <div
      class="modal-backdrop"
      id="automationModal"
      aria-hidden="true"
      role="dialog"
      aria-modal="true"
      aria-labelledby="automationModalTitle"
    >
      <div class="modal automation-modal">
        <div class="modal-heading">
          <div>
            <h2 id="automationModalTitle">CDP 后台点击 POC</h2>
            <p class="automation-subtitle">管理窗口保持前台，游戏窗口不会被主动聚焦。</p>
          </div>
          <button
            class="modal-close-btn"
            id="closeAutomationModalBtn"
            type="button"
            aria-label="关闭 CDP POC"
            title="关闭"
          >
            ×
          </button>
        </div>
        <div class="modal-body">
          <p class="automation-status pending" id="automationStatus">正在准备截图…</p>
          <div class="automation-preview-frame">
            <img
              id="automationPreview"
              class="automation-preview"
              alt="后台游戏窗口截图，点击图中目标以派发 CDP 点击"
              draggable="false"
              hidden
            />
          </div>
          <p class="automation-evidence" id="automationEvidence"></p>
        </div>
        <div class="modal-actions">
          <button class="secondary-button" id="closeAutomationBtn" type="button">关闭</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
