<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' data:; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>火影忍者 OL 国服启动器</title>
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <img src="logo.png" alt="火影忍者 OL" />
          <div>
            <h1>火影忍者 OL 国服启动器</h1>
            <p>腾讯官方扫码登录 · 手动选服 · 独立 Profile 会话</p>
          </div>
        </div>
        <div class="window-actions" aria-label="窗口控制">
          <button class="icon-button" id="alwaysOnTopBtn" title="窗口置顶">置顶</button>
          <button class="icon-button" id="minimizeBtn" title="最小化">—</button>
          <button class="icon-button" id="maximizeBtn" title="最大化">□</button>
        </div>
      </header>

      <main>
        <section class="hero">
          <div>
            <span class="eyebrow">官方登录链路</span>
            <h2>在应用内完成扫码和选服</h2>
            <p>
              启动 Profile
              后，游戏窗口会打开腾讯官方页面。二维码、账号确认和选服均由官方页面处理；启动器不会要求或保存
              QQ 密码。
            </p>
          </div>
          <div class="hero-badge">Flash PPAPI 已启用</div>
        </section>

        <section class="toolbar" aria-label="Profile 工具栏">
          <label class="search-field">
            <span>搜索</span>
            <input id="searchInput" type="search" placeholder="按 Profile 名称搜索" />
          </label>
          <button class="primary-button" id="createProfileBtn">新建 Profile</button>
        </section>

        <section>
          <div class="section-heading">
            <div>
            <h2>Profile 列表</h2>
              <p id="profileCount">0 个 Profile</p>
            </div>
          </div>
          <div class="profile-grid" id="profileGrid" aria-live="polite"></div>
          <div class="empty-state" id="emptyState">
            <h3>还没有 Profile</h3>
            <p>创建一个 Profile，即可使用隔离的持久会话打开腾讯官方扫码页面。</p>
          </div>
        </section>

        <section class="utility-panel">
          <div>
            <h2>运行状态</h2>
            <p id="memorySummary">正在读取内存状态…</p>
          </div>
          <div class="utility-actions">
            <button class="secondary-button" id="refreshBtn">刷新</button>
            <button class="secondary-button" id="diagnosticsBtn">导出脱敏诊断</button>
          </div>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="profileModal" aria-hidden="true">
      <form class="modal" id="profileForm">
        <div class="modal-heading">
          <div>
            <span class="eyebrow">通用元数据</span>
            <h2 id="profileModalTitle">新建 Profile</h2>
          </div>
          <button class="icon-button" id="closeProfileModalBtn" type="button" aria-label="关闭">
            ×
          </button>
        </div>
        <label>
          <span>名称</span>
          <input id="profileName" maxlength="40" required placeholder="例如：主账号" />
        </label>
        <label>
          <span>备注</span>
          <textarea
            id="profileNotes"
            maxlength="200"
            rows="4"
            placeholder="可选，不参与登录或启动地址"
          ></textarea>
        </label>
        <label>
          <span>标识颜色</span>
          <input id="profileColor" type="color" value="#ff8c00" />
        </label>
        <label class="check-row">
          <input id="profileNotifications" type="checkbox" checked />
          <span>启用本地通知</span>
        </label>
        <div class="modal-actions">
          <button class="secondary-button" id="cancelProfileBtn" type="button">取消</button>
          <button class="primary-button" type="submit">保存</button>
        </div>
      </form>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
