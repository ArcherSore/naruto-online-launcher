<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naruto Online 启动器 — 首次设置</title>
    <style>
      :root {
        --bg: #08080d;
        --bg2: #111118;
        --bg3: #1a1a24;
        --card: #12121a;
        --border: #252535;
        --border2: #35354a;
        --fg: #ececf4;
        --muted: #9090a0;
        --dim: #606070;
        --accent: #ff8c00;
        --accent2: #dc2626;
        --ok: #10b981;
        --warn: #f59e0b;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        overflow: hidden;
        font-size: 13px;
      }
      body {
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(ellipse at 20% 0%, rgba(220, 38, 38, 0.1), transparent 50%),
          radial-gradient(ellipse at 80% 100%, rgba(255, 140, 0, 0.06), transparent 50%), var(--bg);
      }

      /* Header */
      header {
        padding: 1.1rem 1.5rem 0.8rem;
        display: flex;
        align-items: center;
        gap: 0.65rem;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(17, 17, 24, 0.8), transparent);
      }
      .logo {
        width: 2.2rem;
        height: 2.2rem;
        background: linear-gradient(135deg, var(--accent2), #7a1414);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        box-shadow:
          0 0 12px rgba(220, 38, 38, 0.5),
          inset 0 -1px 2px rgba(0, 0, 0, 0.3);
        flex-shrink: 0;
      }
      .brand {
        display: flex;
        flex-direction: column;
        gap: 0.1rem;
      }
      .brand h1 {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .brand .sub {
        font-size: 0.65rem;
        color: var(--muted);
      }

      /* Main */
      main {
        flex: 1;
        overflow-y: auto;
        padding: 1rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
      }
      main::-webkit-scrollbar {
        width: 4px;
      }
      main::-webkit-scrollbar-track {
        background: transparent;
      }
      main::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }

      /* Section card */
      .section {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        padding: 0.85rem 1rem;
        transition: border-color 0.2s;
      }
      .section:hover {
        border-color: var(--border2);
      }
      .section h2 {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--accent);
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      /* Language selector — 3x2 grid */
      .lang-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 0.35rem;
      }
      .lang-btn {
        padding: 0.5rem 0.4rem;
        background: var(--bg3);
        border: 1px solid var(--border2);
        border-radius: 0.35rem;
        color: var(--fg);
        font-size: 0.78rem;
        cursor: pointer;
        transition: 0.15s;
        font-family: inherit;
        text-align: center;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.3rem;
      }
      .lang-btn:hover {
        border-color: var(--accent);
        background: rgba(255, 140, 0, 0.04);
      }
      .lang-btn.active {
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-color: transparent;
        color: #fff;
        font-weight: 600;
        box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
      }
      .lang-btn .flag {
        font-size: 0.9rem;
      }

      /* Telemetry */
      .tel-body {
        font-size: 0.75rem;
        line-height: 1.5;
        color: var(--muted);
        margin-bottom: 0.5rem;
      }
      .tel-control {
        font-size: 0.68rem;
        color: var(--ok);
        margin-bottom: 0.4rem;
        line-height: 1.4;
      }
      .tel-transparency {
        font-size: 0.64rem;
        color: var(--accent);
        margin-bottom: 0.6rem;
        line-height: 1.4;
        padding: 0.35rem 0.5rem;
        background: rgba(255, 140, 0, 0.05);
        border-left: 2px solid var(--accent);
        border-radius: 0 0.2rem 0.2rem 0;
      }
      .tel-choice {
        display: flex;
        gap: 0.4rem;
      }
      .tel-choice label {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.45rem 0.5rem;
        background: var(--bg3);
        border: 1px solid var(--border2);
        border-radius: 0.35rem;
        cursor: pointer;
        font-size: 0.73rem;
        transition: 0.15s;
      }
      .tel-choice label:hover {
        border-color: var(--accent);
      }
      .tel-choice input {
        accent-color: var(--accent);
      }
      .tel-choice label.selected {
        border-color: var(--ok);
        background: rgba(16, 185, 129, 0.06);
      }

      /* Mode */
      .mode-card {
        padding: 0.55rem 0.7rem;
        background: var(--bg3);
        border: 1px solid var(--border2);
        border-radius: 0.35rem;
        margin-bottom: 0.35rem;
        cursor: pointer;
        transition: 0.15s;
      }
      .mode-card:last-child {
        margin-bottom: 0;
      }
      .mode-card:hover {
        border-color: var(--accent);
      }
      .mode-card.active {
        border-color: var(--accent);
        background: rgba(255, 140, 0, 0.06);
        box-shadow: 0 0 0 1px rgba(255, 140, 0, 0.15);
      }
      .mode-card .name {
        font-size: 0.82rem;
        font-weight: 600;
        margin-bottom: 0.1rem;
      }
      .mode-card .desc {
        font-size: 0.68rem;
        color: var(--muted);
        line-height: 1.4;
        margin-bottom: 0.2rem;
      }
      .mode-card .hint {
        font-size: 0.6rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--dim);
        font-weight: 600;
      }
      .mode-card.active .hint {
        color: var(--accent);
      }

      /* Footer */
      footer {
        padding: 0.7rem 1.5rem;
        border-top: 1px solid var(--border);
        background: var(--bg2);
      }
      .btn-save {
        width: 100%;
        padding: 0.7rem;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        color: #fff;
        border: none;
        border-radius: 0.45rem;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.4px;
        cursor: pointer;
        transition: 0.2s;
        font-family: inherit;
        position: relative;
        overflow: hidden;
      }
      .btn-save::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.15), transparent);
        transition: left 0.4s;
      }
      .btn-save:hover::after {
        left: 100%;
      }
      .btn-save:hover {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.4);
      }
      .btn-save:active {
        transform: translateY(0);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">🍥</div>
      <div class="brand">
        <h1 data-i18n="setup.title">欢迎使用 Naruto Online 启动器</h1>
        <span class="sub" data-i18n="setup.subtitle">约 30 秒完成首次设置</span>
      </div>
    </header>

    <main>
      <!-- Language Selector (6 languages) -->
      <div class="section">
        <h2 data-i18n="setup.language.label">界面语言</h2>
        <div class="lang-grid">
          <button class="lang-btn active" data-lang="zh-CN">
            <span class="flag">🇨🇳</span> 简体中文
          </button>
          <button class="lang-btn" data-lang="en"><span class="flag">🇺🇸</span> English</button>
          <button class="lang-btn" data-lang="de"><span class="flag">🇩🇪</span> Deutsch</button>
          <button class="lang-btn" data-lang="es"><span class="flag">🇪🇸</span> Español</button>
          <button class="lang-btn" data-lang="pl"><span class="flag">🇵🇱</span> Polski</button>
          <button class="lang-btn" data-lang="fr"><span class="flag">🇫🇷</span> Français</button>
        </div>
      </div>

      <!-- Performance Mode -->
      <div class="section">
        <h2 data-i18n="setup.mode.title">性能模式</h2>
        <div class="mode-card active" data-mode="default">
          <div class="name">⚡ <span data-i18n="mode.default">默认优化</span></div>
          <div class="desc" data-i18n="setup.mode.default.body">
            推荐所有设备使用：启用经过验证的 GPU、GC 等安全优化。
          </div>
          <div class="hint" data-i18n="setup.mode.default.hint">默认 · 推荐</div>
        </div>
        <div class="mode-card" data-mode="lowpc">
          <div class="name">🔥 <span data-i18n="mode.lowpc">低配模式</span></div>
          <div class="desc" data-i18n="setup.mode.lowpc.body">
            仅适合旧 GPU 或少于 4GB RAM 的设备：降低 Flash 画质以提高 FPS。
          </div>
          <div class="hint" data-i18n="setup.mode.lowpc.hint">低配设备 · 手动启用</div>
        </div>
      </div>
    </main>

    <footer>
      <button class="btn-save" id="btn-save" data-i18n="setup.save">保存并进入启动器</button>
    </footer>

    <script>
      (function () {
        'use strict';

        // ── i18n dictionary (matches src/config/i18n.js SUPPORTED) ──
        var I18N = {
          'zh-CN': {
            'setup.title': '欢迎使用 Naruto Online 启动器',
            'setup.subtitle': '约 30 秒完成首次设置',
            'setup.language.label': '界面语言',
            'setup.mode.title': '性能模式',
            'setup.mode.default.body':
              '推荐所有设备使用：启用经过验证的 GPU、GC 等安全优化。',
            'setup.mode.lowpc.body':
              '仅适合旧 GPU 或少于 4GB RAM 的设备：降低 Flash 画质以提高 FPS。',
            'setup.mode.default.hint': '默认 · 推荐',
            'setup.mode.lowpc.hint': '低配设备 · 手动启用',
            'setup.save': '保存并进入启动器',
            'mode.default': '默认优化',
            'mode.lowpc': '低配模式'
          },
          en: {
            'setup.title': 'Welcome to Naruto Online Launcher',
            'setup.subtitle': 'Set up your experience in 30 seconds',
            'setup.language.label': 'Language',
            'setup.mode.title': 'Performance Mode',
            'setup.mode.default.body':
              'Recommended — maximum safe optimization (GPU, smart GC, anti-lag).',
            'setup.mode.lowpc.body':
              'Low-end PCs (old GPU or <4GB RAM). Reduces Flash visual quality. ⚠️ May harm performance on modern PCs.',
            'setup.mode.default.hint': 'Default • Optimized',
            'setup.mode.lowpc.hint': 'Low-end PC • Opt-in',
            'setup.save': 'Start playing',
            'mode.default': 'Optimized Default',
            'mode.lowpc': 'Low-end PC Mode'
          },
          de: {
            'setup.title': 'Willkommen beim Naruto Online Launcher',
            'setup.subtitle': 'Richten Sie Ihre Erfahrung in 30 Sekunden ein',
            'setup.language.label': 'Sprache',
            'setup.mode.title': 'Leistungsmodus',
            'setup.mode.default.body': 'Empfohlen — maximale sichere Optimierung.',
            'setup.mode.lowpc.body':
              'Schwache PCs (alte GPU oder <4GB RAM). Reduziert Flash-Qualität. ⚠️ Kann auf modernen PCs schaden.',
            'setup.mode.default.hint': 'Standard • Optimiert',
            'setup.mode.lowpc.hint': 'Schwacher PC • Opt-in',
            'setup.save': 'Spiel starten',
            'mode.default': 'Optimierter Standard',
            'mode.lowpc': 'Schwacher PC Modus'
          },
          es: {
            'setup.title': 'Bienvenido al Naruto Online Launcher',
            'setup.subtitle': 'Configura tu experiencia en 30 segundos',
            'setup.language.label': 'Idioma',
            'setup.mode.title': 'Modo de rendimiento',
            'setup.mode.default.body': 'Recomendado — máxima optimización segura.',
            'setup.mode.lowpc.body':
              'PCs de gama baja (GPU antigua o <4GB RAM). Reduce calidad visual de Flash. ⚠️ Puede perjudicar en PCs modernos.',
            'setup.mode.default.hint': 'Predeterminado • Optimizado',
            'setup.mode.lowpc.hint': 'PC débil • Opt-in',
            'setup.save': 'Empezar a jugar',
            'mode.default': 'Predeterminado Optimizado',
            'mode.lowpc': 'Modo PC Débil'
          },
          pl: {
            'setup.title': 'Witaj w Naruto Online Launcher',
            'setup.subtitle': 'Skonfiguruj w 30 sekund',
            'setup.language.label': 'Język',
            'setup.mode.title': 'Tryb wydajności',
            'setup.mode.default.body': 'Zalecany — maksymalna bezpieczna optymalizacja.',
            'setup.mode.lowpc.body':
              'Słabe PC (stara GPU lub <4GB RAM). Zmniejsza jakość Flash. ⚠️ Może szkodzić na nowoczesnych PC.',
            'setup.mode.default.hint': 'Domyślny • Zoptymalizowany',
            'setup.mode.lowpc.hint': 'Słaby PC • Opt-in',
            'setup.save': 'Zacznij grać',
            'mode.default': 'Zoptymalizowany Domyślny',
            'mode.lowpc': 'Tryb Słabego PC'
          },
          fr: {
            'setup.title': 'Bienvenue dans Naruto Online Launcher',
            'setup.subtitle': 'Configurez en 30 secondes',
            'setup.language.label': 'Langue',
            'setup.mode.title': 'Mode de performance',
            'setup.mode.default.body': 'Recommandé — optimisation sûre maximale.',
            'setup.mode.lowpc.body':
              'PC faibles (ancien GPU ou <4Go RAM). Réduit la qualité Flash. ⚠️ Peut nuire aux PC modernes.',
            'setup.mode.default.hint': 'Par défaut • Optimisé',
            'setup.mode.lowpc.hint': 'PC faible • Opt-in',
            'setup.save': 'Commencer à jouer',
            'mode.default': 'Défaut Optimisé',
            'mode.lowpc': 'Mode PC Faible'
          }
        };

        var currentLang = 'zh-CN';
        var selectedMode = 'default';

        // Detect initial language via query string (?lang=en)
        try {
          var params = new URLSearchParams(window.location.search);
          var lang = params.get('lang');
          if (lang && I18N[lang]) currentLang = lang;
        } catch (_) {
          /* ignore */
        }

        function applyLanguage(lang) {
          currentLang = lang;
          var dict = I18N[lang] || I18N['zh-CN'];
          var langMap = {
            'zh-CN': 'zh-CN',
            en: 'en',
            de: 'de',
            es: 'es',
            pl: 'pl',
            fr: 'fr'
          };
          document.documentElement.lang = langMap[lang] || 'zh-CN';
          document.querySelectorAll('[data-i18n]').forEach(function (el) {
            var key = el.getAttribute('data-i18n');
            if (dict[key]) el.textContent = dict[key];
          });
          document.querySelectorAll('.lang-btn').forEach(function (btn) {
            btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
          });
        }

        // Language buttons
        document.querySelectorAll('.lang-btn').forEach(function (btn) {
          btn.addEventListener('click', function () {
            applyLanguage(btn.getAttribute('data-lang'));
          });
        });

        // Telemetry radio
        document.querySelectorAll('.tel-choice label').forEach(function (label) {
          label.addEventListener('click', function () {
            document.querySelectorAll('.tel-choice label').forEach(function (l) {
              l.classList.remove('selected');
            });
            label.classList.add('selected');
            var radio = label.querySelector('input[type=radio]');
            if (radio) radio.checked = true;
          });
        });

        // Mode cards
        document.querySelectorAll('.mode-card').forEach(function (card) {
          card.addEventListener('click', function () {
            document.querySelectorAll('.mode-card').forEach(function (c) {
              c.classList.remove('active');
            });
            card.classList.add('active');
            selectedMode = card.getAttribute('data-mode');
          });
        });

        // Save button — communicate via document title hack (main.js intercepts)
        document.getElementById('btn-save').addEventListener('click', function () {
          var advancedMode = selectedMode === 'lowpc';
          window.__setupResult = {
            language: currentLang,
            advancedMode: advancedMode
          };
          document.title = '__SETUP_DONE__' + JSON.stringify(window.__setupResult);
          window.close();
        });

        // Apply initial language
        applyLanguage(currentLang);
      })();
    </script>
  </body>
</html>
